<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Impala Demo — Live Webcasts</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="assets/ddMusic.ico" />
  <style>
    .demo-live-player { width: 100%; max-height: 62vh; margin-top: 1rem; background: #080b10; border-radius: 1rem; }
    .demo-webcasts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .demo-webcast { text-align: left; cursor: pointer; }
    .demo-webcast img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: .7rem; }
    .demo-webcast strong, .demo-webcast span { display: block; margin-top: .45rem; }
    .demo-live-message { min-height: 1.5rem; }
  </style>
</head>
<body>
  <div class="page-shell song-list-page-shell">
    <div class="page-orb page-orb-left"></div><div class="page-orb page-orb-right"></div>
    <main class="live-main">
      <header class="preferences-top">
        <div><p class="eyebrow">Impala Demo Edition</p><h1>Live Webcasts</h1></div>
        <div class="song-list-links"><a class="song-list-back" href="index.html">Back to Player</a><a class="song-list-back" href="preferences.html">Settings</a></div>
      </header>
      <section class="prefs-panel live-panel">
        <h2>Public stream examples</h2>
        <p>Choose a sample webcast. This demo plays public stream URLs directly in your browser and does not use an Impala live-session service.</p>
        <div id="webcast-list" class="demo-webcasts" aria-label="Available webcasts"></div>
        <video id="webcast-player" class="demo-live-player" controls playsinline></video>
        <p id="webcast-status" class="prefs-status demo-live-message" aria-live="polite">Select a webcast to begin.</p>
      </section>
    </main>
  </div>
  <script src="vendor/hls.min.js"></script>
  <script>
    (() => {
      const list = document.getElementById("webcast-list");
      const player = document.getElementById("webcast-player");
      const status = document.getElementById("webcast-status");
      let hls;
      fetch("metadata.json").then((response) => response.json()).then((catalog) => {
        for (const stream of catalog.webcasts || []) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "demo-webcast prefs-panel";
          const image = document.createElement("img");
          image.src = catalog.posters?.[stream.poster] || "assets/dd imala.jpg";
          image.alt = "";
          const title = document.createElement("strong");
          title.textContent = stream.title;
          const caption = document.createElement("span");
          caption.textContent = stream.category ? `${stream.category} · Public HLS` : "Public HLS webcast";
          button.append(image, title, caption);
          button.addEventListener("click", () => {
            hls?.destroy();
            const url = stream.url;
            status.textContent = `Loading ${stream.title}…`;
            if (window.Hls?.isSupported()) {
              hls = new Hls(); hls.loadSource(url); hls.attachMedia(player);
            } else if (player.canPlayType("application/vnd.apple.mpegurl")) {
              player.src = url;
            } else {
              status.textContent = "This browser does not support HLS playback."; return;
            }
            player.play().then(() => { status.textContent = `Playing ${stream.title}`; })
              .catch(() => { status.textContent = `Ready: ${stream.title}. Press Play to start the stream.`; });
          });
          list.appendChild(button);
        }
      }).catch(() => { status.textContent = "Could not load the local webcast catalog."; });
    })();
  </script>
</body>
</html>
